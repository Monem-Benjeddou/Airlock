included:
  - Sources
  - Tests
  - App
  - ParserXPC
  - UITests
excluded:
  - .build
  - Tests/AirlockTestSupport/Fixtures
strict: true
opt_in_rules:
  - array_init
  - closure_spacing
  - contains_over_first_not_nil
  - empty_count
  - explicit_init
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - last_where
  - modifier_order
  - operator_usage_whitespace
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - yoda_condition
disabled_rules:
  # Device and process output must always decode; lossy `String(decoding:as:)` is intended.
  - optional_data_string_conversion
  - todo
  - trailing_comma
  - nesting
line_length:
  warning: 140
  error: 160
  ignores_comments: true
  ignores_urls: true
file_length:
  warning: 600
  error: 800
type_body_length:
  warning: 400
  error: 500
function_body_length:
  warning: 60
  error: 100
identifier_name:
  min_length: 1
  excluded: [id, ok, to]
cyclomatic_complexity:
  warning: 15
  error: 25
large_tuple:
  warning: 4
custom_rules:
  no_shell_strings:
    name: "No shell command strings"
    regex: '("/(usr/)?bin/(ba|z|da|k)?sh"|"(ba|z|da|k)?sh"\s*,\s*"-c")'
    message: "Never run commands through a shell; pass argument arrays to ProcessRunner."
    severity: error
  # REUSE-IgnoreStart
  spdx_header:
    name: "SPDX header"
    regex: '\A(?!// SPDX-License-Identifier: GPL-3\.0-only)'
    message: "Every Swift file starts with the SPDX licence header."
    severity: error
    match_kinds: []
  # REUSE-IgnoreEnd
